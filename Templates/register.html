<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCast - Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="brand">
            <div class="brand-mark">CC</div>
            <div class="brand-name">Career<span>Cast</span></div>
        </div>
        <p class="auth-subtitle">Create an account to save your profile and predictions.</p>

        {% if errors %}
            <div class="alert alert-error">
                {% for e in errors %}<div>{{ e }}</div>{% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <label>Full name</label>
            <input type="text" name="name" value="{{ name or '' }}" required autofocus>

            <label>Email</label>
            <input type="email" name="email" value="{{ email or '' }}" required>

            <label>Password</label>
            <input type="password" name="password" required minlength="6">
            <div class="field-hint">At least 6 characters.</div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</body>
</html>
