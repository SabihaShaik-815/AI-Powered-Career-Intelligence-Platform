<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCast - Log In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="brand">
            <div class="brand-mark">CC</div>
            <div class="brand-name">Career<span>Cast</span></div>
        </div>
        <p class="auth-subtitle">Log in to analyze your resume and get role predictions.</p>

        {% if registered %}
            <div class="alert alert-success">Account created — you can log in now.</div>
        {% endif %}
        {% if errors %}
            <div class="alert alert-error">
                {% for e in errors %}<div>{{ e }}</div>{% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <label>Email</label>
            <input type="email" name="email" value="{{ email or '' }}" required autofocus>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </div>
</body>
</html>
