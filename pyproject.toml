[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "careercast"
version = "1.0.0"
description = "AI-Powered Career Intelligence Platform for resume parsing, career prediction, and career recommendations."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "CareerCast Team" }
]

keywords = [
    "artificial-intelligence",
    "machine-learning",
    "career-recommendation",
    "resume-parser",
    "career-prediction",
    "xgboost",
    "random-forest"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy>=1.24",
    "joblib>=1.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "PyPDF2>=3.0",
    "python-docx>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "build>=1.0",
    "twine>=4.0"
]

streamlit = [
    "streamlit>=1.30",
    "reportlab>=4.0"
]

[project.urls]
Homepage = "https://github.com/SabihaShaik-815/AI-Powered-Career-Intelligence-Platform"
Repository = "https://github.com/SabihaShaik-815/AI-Powered-Career-Intelligence-Platform"
Issues = "https://github.com/SabihaShaik-815/AI-Powered-Career-Intelligence-Platform/issues"

[project.scripts]
careercast = "careercast.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [
    "."
]
include = [
    "careercast",
    "careercast.*"
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
python_classes = [
    "Test*"
]
python_functions = [
    "test_*"
]
addopts = "-v"

[tool.coverage.run]
source = [
    "careercast"
]

[tool.coverage.report]
show_missing = true
skip_covered = false